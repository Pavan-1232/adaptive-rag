# Dev table questions (15). Written in a separate session from the PDFs in
# benchmarks/documents/dev/ only. Pages are physical PDF pages (blank pages counted).
# Quotes are the row label followed by its values left to right. Superscript footnote
# markers are kept attached to the label (e.g. "Unemployment rate1"), as pdfplumber extracts them.

# ---------------------------------------------------------------- Fed MPR (6)

- id: tbl-fed-01
  document: fed_mpr_feb2025.pdf
  type: table
  question: In the December 2024 projections, what median unemployment rate did Fed officials expect for the end of 2025?
  answerable: true
  evidence:
    - page: 59
      quote: Unemployment rate 4.2 4.3 4.3 4.3 4.2 4.2 4.2–4.5 4.1–4.4 4.0–4.4 3.9–4.3 4.2 4.2–4.5 3.9–4.6 3.8–4.5 3.5–4.5
  expected_answer: 4.3 percent (median)
  notes: >-
    Trap: the September projection row below gives 4.4 for 2025; the longer-run median is 4.2,
    and 2026 and 2027 are also 4.3, so the column must be read, not guessed.
  source: "claude-separate-session, user spot-checked"

