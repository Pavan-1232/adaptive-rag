# ---------------------------------------------------------------- NIST AI RMF (4)

- id: tbl-nist-01
  document: nist_ai_rmf.pdf
  type: table
  question: What does the GOVERN function expect organisations to have ready in case third-party data or AI systems fail?
  answerable: true
  evidence:
    - page: 29
      quote: "GOVERN 6.2: Contingency processes are in place to handle"
  expected_answer: Contingency processes to handle failures or incidents in third-party data or AI systems deemed high-risk (GOVERN 6.2).
  notes: >-
    Trap: GOVERN 6.1 directly above is also about third-party risk (policies, IP infringement);
    MANAGE 3.1 and MAP 4.1 also mention third parties. Table 1 continuation page.
    Known extraction failure (2026-11-04): the PDF loader interleaves this row line by line with
    the table's left Categories column, so the full sentence never appears as one string. The
    quote was shortened to the prefix that survives intact; the question and answer are unchanged.
  source: "claude-separate-session, user spot-checked"

- id: tbl-nist-02
  document: nist_ai_rmf.pdf
  type: table
  question: Under the MAP function, what must be true of the processes for humans overseeing an AI system?
  answerable: true
  evidence:
    - page: 32
      quote: "MAP 3.5: Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from the GOVERN function."
  expected_answer: They are defined, assessed, and documented in line with organizational policies from the GOVERN function (MAP 3.5).
  notes: >-
    Trap: MAP 3.4 directly above covers operator and practitioner proficiency; GOVERN 3.2
    covers roles for human-AI configurations and oversight. Table 2 continuation page.
  source: "claude-separate-session, user spot-checked"

- id: tbl-nist-03
  document: nist_ai_rmf.pdf
  type: table
  question: Which MEASURE subcategory deals with an AI system's privacy risk, and what does it require?
  answerable: true
  evidence:
    - page: 35
      quote: "MEASURE 2.10: Privacy risk of the AI system – as identified in the MAP function – is examined and documented."
  expected_answer: MEASURE 2.10 — privacy risk, as identified in the MAP function, is examined and documented.
  notes: >-
    Trap: MEASURE 2.8 (transparency and accountability, "examined and documented") and 2.11
    (fairness and bias, "evaluated") use near-identical wording. Table 3 continuation page.
  source: "claude-separate-session, user spot-checked"

- id: tbl-nist-04
  document: nist_ai_rmf.pdf
  type: table
  question: According to the MANAGE function, who should be told about incidents and errors?
  answerable: true
  evidence:
    - page: 38
      quote: "MANAGE 4.3: Incidents and errors are communicated to relevant"
  expected_answer: Relevant AI actors, including affected communities (MANAGE 4.3); processes for tracking, responding to, and recovering from incidents and errors are followed and documented.
  notes: >-
    Quote is the first sentence only; the second sentence has a hyphenated line break
    ("track-ing"). Trap: MANAGE 2.3 is about responding to and recovering from previously
    unknown risks; MEASURE 3.3 covers end users reporting problems. Table 4 continuation page.
    Known extraction failure (2026-11-04): the PDF loader interleaves this row with the left
    Categories column ("monitored regularly." lands mid-sentence). The quote was shortened to the
    prefix that survives intact; the question and answer are unchanged.
  source: "claude-separate-session, user spot-checked"

