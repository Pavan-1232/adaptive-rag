# Multi-part dev benchmark questions (dev documents only).
# Written in a separate session from the PDFs in benchmarks/documents/dev/ and the template format.
# Each evidence item is one required fact. Pages are physical PDF pages.

# ---------------------------------------------------------------- tesla_10k.pdf

- id: mp-tesla-01
  document: tesla_10k.pdf
  type: multi_part
  question: What does Tesla mainly make at its Buffalo factory, and how long does it have to meet its $5 billion New York spending commitment?
  answerable: true
  evidence:
    - page: 22
      quote: "These agreements provide for the construction and use of our Gigafactory New York, which we have primarily used for the development and production of our Solar Roof and other solar products and components, energy storage components and Supercharger components, and for other lessor-approved functions."
    - page: 88
      quote: "In 2021, an amendment was executed to extend our overall agreement to spend or incur $5.00 billion in combined capital, operational expenses, costs of goods sold and other costs in the State of New York through December 31, 2029."
  expected_answer: Gigafactory New York is mainly used for Solar Roof and other solar products, energy storage components and Supercharger components; a 2021 amendment extended the $5.00 billion New York spending commitment through December 31, 2029.
  notes: The deadline is the easy-to-miss part. It appears only in Note 14 (page 88); the risk factor on page 22 gives only the original 10-year period starting April 30, 2018, which is not the current deadline.
  source: "claude-separate-session, user spot-checked"

- id: mp-tesla-02
  document: tesla_10k.pdf
  type: multi_part
  question: How much energy storage did Tesla deploy in 2024, what drove the jump in energy revenue, and does Tesla own or lease its Lathrop, California Megafactory?
  answerable: true
  evidence:
    - page: 35
      quote: "In 2024, we deployed 31.4 GWh of energy storage products."
    - page: 41
      quote: "Energy generation and storage revenue increased $4.05 billion, or 67%, in the year ended December 31, 2024 as compared to the year ended December 31, 2023, primarily due to a 16.7 GWh increase in Megapack and Powerwall deployments compared to the prior year."
    - page: 32
      quote: "Megafactory Lathrop Lathrop, California Leased"
  expected_answer: 31.4 GWh deployed; energy revenue rose $4.05 billion (67%), mainly because Megapack and Powerwall deployments grew by 16.7 GWh; Megafactory Lathrop is leased.
  notes: Mixes a table row (Properties table) with two prose facts from different parts of the MD&A.
  source: "claude-separate-session, user spot-checked"

- id: mp-tesla-03
  document: tesla_10k.pdf
  type: multi_part
  question: Roughly how many vehicles did Tesla deliver in 2024? Did its automotive sales revenue grow or shrink that year, and by how much?
  answerable: true
  evidence:
    - page: 35
      quote: "In 2024, we produced approximately 1,773,000 consumer vehicles and delivered approximately 1,789,000 consumer vehicles."
    - page: 40
      quote: "Automotive sales $ 72,480 $ 78,509 $ 67,210 $ (6,029) (8)% $ 11,299 17 %"
