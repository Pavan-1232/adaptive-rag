- id: nist_ai_rmf-gen-016
  document: nist_ai_rmf.pdf
  type: conceptual
  question: How does the process of converting complex human behaviors into mathematical
    models potentially hinder efforts to manage AI risks?
  answerable: true
  evidence:
  - page: 45
    quote: Many of the data-driven approaches that AI systems rely on attempt to convert
      or represent individual and social observational and decision-making practices
      into measurable quantities. Representing complex human phenomena with mathematical
      models can come at the cost of removing necessary context. This loss of context
      may in turn make it difficult to understand individual and societal impacts
      that are key to AI risk management efforts.
  notes: ''
  source: llm, reviewed by assistant
