  source: llm, reviewed by assistant
- id: ragas-gen-010
  document: ragas.pdf
  type: conceptual
  question: How does one determine if an AI's response accurately reflects the provided
    source material without making up unsupported claims?
  answerable: true
  evidence:
  - page: 5
    quote: Faithfulness measures the information consistency of the answer against
      the given context. Any claims that are made in the answer that cannot be deduced
      from context should be penalized.
    alternatives:
    - page: 3
      quote: 'can be inferred from the context'
  notes: ''
  source: llm, reviewed by assistant
- id: ragas-gen-011
  document: ragas.pdf
  type: multi_part
  question: How do the automated metrics compare to human judgments across different
    quality dimensions, and which specific aspect proves most difficult for current
    models to evaluate?
  answerable: true
  evidence:
  - page: 5
    quote: We found context relevance to be the hardest quality dimension to evaluate.
      In particular, we observed that ChatGPT often struggles with the task of selecting
      the sentences from the context that are crucial, especially for longer contexts.
  notes: ''
  source: llm, reviewed by assistant
