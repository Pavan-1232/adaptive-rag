- id: ragas-gen-001
  document: ragas.pdf
  type: conceptual
  question: How does a system overcome an LLM's inability to answer questions about
    recent events or obscure facts?
  answerable: true
  evidence:
  - page: 1
    quote: The standard solution to these issues is to rely on Retrieval Augmented
      Generation (RAG) (Lee et al., 2019; Lewis et al., 2020; Guu et al., 2020). Answering
      a question then essentially involves retrieving relevant passages from a corpus
      and feeding these passages, along with the original question, to the LM.
  notes: ''
  source: llm, reviewed by assistant
- id: ragas-gen-003
  document: ragas.pdf
  type: factual
  question: How does the SelfCheckGPT method determine if an answer is factual when
    a model does not provide access to token probabilities?
  answerable: true
  evidence:
  - page: 2
    quote: 'SelfCheckGPT (Manakul et al., 2023) addresses this problem by instead
      sampling multiple answers. Their core idea is that factual answers are more
      stable: when an answer is factual, we can expect that different samples will
      tend to be semantically similar, whereas this is less likely to be the case
      for hallucinated answers.'
  notes: ''
  source: llm, reviewed by assistant
- id: ragas-gen-004
  document: ragas.pdf
  type: conceptual
  question: How do methods like BERTScore and MoverScore measure the quality of a
    generated response?
  answerable: true
  evidence:
  - page: 2
    quote: For instance, BERTScore (Zhang et al., 2020) and MoverScore (Zhao et al.,
      2019) use contextualised embeddings, produced by a pre-trained BERT model, to
      compare the similarity between the generated answer and the reference answers.
  notes: ''
  source: llm, reviewed by assistant
- id: ragas-gen-007
  document: ragas.pdf
  type: conceptual
  question: How does the system determine whether a question's context contains only
    necessary information or includes redundant details?
  answerable: true
  evidence:
  - page: 3
    quote: 'In particular, this metric aims to penalise the inclusion of redundant
      information. To estimate context relevance, given a question q and its context
      c(q), the LLM extracts a subset of sentences, S , from c(q) that are crucial
      to answer q, using ext the following prompt: Please extract relevant sentences
      from the provided context that can potentially help answer the following question.'
  notes: ''
  source: llm, reviewed by assistant
- id: ragas-gen-009
  document: ragas.pdf
  type: factual
