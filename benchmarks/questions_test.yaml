# ===== nist_csf.pdf =====
- id: csf-01
  document: nist_csf.pdf
  type: factual
  question: What are the six core functions in version 2.0 of the NIST Cybersecurity Framework?
  answerable: true
  evidence:
    - page: 8
      quote: "The CSF Core Functions — GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, and RECOVER"
  expected_answer: Govern, Identify, Protect, Detect, Respond, Recover
  source: claude-separate-session

- id: csf-02
  document: nist_csf.pdf
  type: conceptual
  question: Why is GOVERN drawn at the middle of the framework's wheel diagram?
  answerable: true
  evidence:
    - page: 9
      quote: "GOVERN is in the center of the wheel because it informs how an organization will implement the other five Functions."
  expected_answer: Because it informs how an organization implements the other five functions
  source: claude-separate-session

- id: csf-03
  document: nist_csf.pdf
  type: factual
  question: What are the names of the four tiers used to describe how rigorous an organization's cybersecurity risk management is?
  answerable: true
  evidence:
    - page: 12
      quote: "Partial (Tier 1), Risk Informed (Tier 2), Repeatable (Tier 3), and Adaptive (Tier 4)"
  expected_answer: Partial, Risk Informed, Repeatable, Adaptive
  source: claude-separate-session

- id: csf-04
  document: nist_csf.pdf
  type: multi_part
  question: Which category identifier covers supply chain risk, and what does its fourth subcategory require?
  answerable: true
  evidence:
    - page: 20
      quote: "Cybersecurity Supply Chain Risk Management GV.SC"
    - page: 22
      quote: "GV.SC-04: Suppliers are known and prioritized by criticality"
  expected_answer: GV.SC; suppliers are known and prioritized by criticality
  source: claude-separate-session

- id: csf-05
  document: nist_csf.pdf
  type: conceptual
  question: Which functions help stop incidents before they happen, and which help deal with them afterwards?
  answerable: true
  evidence:
    - page: 10
      quote: "GOVERN, IDENTIFY, and PROTECT outcomes help prevent and prepare for incidents, while GOVERN, DETECT, RESPOND, and RECOVER outcomes help discover and manage incidents."
  expected_answer: Govern, Identify and Protect help prevent and prepare; Govern, Detect, Respond and Recover help discover and manage incidents
  source: claude-separate-session

- id: csf-un
  document: nist_csf.pdf
  type: near_miss
  question: What minimum Tier must an organization reach to be certified as compliant with CSF 2.0?
  answerable: false
  evidence: []
  notes: The CSF describes Tiers but defines no certification or minimum required Tier.
  source: claude-separate-session

# ===== raptor.pdf =====
- id: raptor-01
  document: raptor.pdf
  type: factual
  question: How long are the text pieces RAPTOR starts from before it builds its tree?
  answerable: true
  evidence:
    - page: 3
      quote: "segmenting the retrieval corpus into short, contiguous texts of length 100"
  expected_answer: About 100 tokens; a sentence that would cross the limit moves whole to the next chunk
  source: claude-separate-session

- id: raptor-02
  document: raptor.pdf
  type: conceptual
  question: Why did the authors end up preferring the collapsed tree approach over tree traversal?
  answerable: true
  evidence:
    - page: 5
      quote: "We believe collapsed tree retrieval is better due to offering greater flexibility than tree traversal"
  expected_answer: It is more flexible, searching all nodes at once so it can pick information at the right level of detail; it also performed better
  source: claude-separate-session

