# Trap: Services gross margin (71,050) and Services cost of sales (25,119) sit in nearby tables.
- id: apple-01
  document: apple_10k.pdf
  type: table
  question: How much revenue did Apple's Services business bring in during fiscal 2024?
  answerable: true
  evidence:
    - page: 26
      quote: "Services (1) 96,169 13 % 85,200"
      alternatives:
        - page: 32
          quote: "Services 96,169 85,200 78,129"
        - page: 38
          quote: "Services (1) 96,169 85,200 78,129"
  expected_answer: $96,169 million (about $96.2 billion)
  notes: Do not confuse with Services gross margin of $71,050 million.
  source: claude-separate-session

