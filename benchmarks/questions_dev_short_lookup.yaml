# Dev short-lookup questions (12). Written in a separate session from the PDFs in
# benchmarks/documents/dev/ only. Pages in evidence are physical PDF pages (blank pages counted).
# For "short title" questions the evidence is the contents line, and expected_answer gives the
# PRINTED page number shown on the contents page (not the physical page).
# ragas.pdf has no table of contents, so it is not used.

# ---------------------------------------------------------------- Short title (8)

- id: sl-01
  document: tesla_10k.pdf
  type: factual
  question: Cybersecurity in Tesla's 10-K
  answerable: true
  evidence:
    - page: 3
      quote: Item 1C. Cybersecurity 28
  expected_answer: Item 1C. Cybersecurity, page 28
  notes: Short title; one-word item title plus document mention, asking where the section is.
  source: "claude-separate-session, user-reviewed"

