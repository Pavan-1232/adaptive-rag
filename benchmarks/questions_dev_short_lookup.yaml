# ---------------------------------------------------------------- Short topical (4)

- id: sl-09
  document: tesla_10k.pdf
  type: factual
  question: What does Tesla's 10-K say about how it responds to cybersecurity incidents?
  answerable: true
  evidence:
    - page: 31
      quote: >-
        We have implemented incident response and breach management processes which have four
        overarching and interconnected stages: 1) preparation for a cybersecurity incident, 2)
        detection and analysis of a security incident, 3) containment, eradication and recovery,
        and 4) post-incident analysis.
  expected_answer: >-
    A four-stage incident response and breach management process: preparation, detection and
    analysis, containment/eradication/recovery, and post-incident analysis.
  notes: >-
    Short topical; the topic resembles the "Cybersecurity" contents entry, but the answer is the
    Item 1C content, not the contents page.
  source: "claude-separate-session, user-reviewed"

- id: sl-10
  document: nist_ai_rmf.pdf
  type: conceptual
  question: Explain risk tolerance in the AI RMF
  answerable: true
  evidence:
    - page: 12
      quote: >-
        it does not prescribe risk tolerance. Risk tolerance refers to the organization’s or AI
        actor’s (see Appendix A) readiness to bear the risk in order to achieve its objectives.
  expected_answer: >-
    Risk tolerance is an organization’s or AI actor's readiness to bear risk to achieve its
    objectives; the AI RMF does not prescribe it, and it is contextual and use-case specific.
  notes: >-
    Short topical; same topic as sl-04 but asks for the meaning, so the evidence is section
    1.2.2's text, not its contents line.
  source: "claude-separate-session, user-reviewed"

- id: sl-11
  document: nist_ai_rmf.pdf
  type: conceptual
  question: What does the Govern function do?
  answerable: true
  evidence:
    - page: 26
      quote: >-
        cultivates and implements a culture of risk management within
        organizations designing, developing, deploying, evaluating, or acquiring AI systems;
  expected_answer: >-
    It cultivates a culture of risk management in organizations working with AI systems, and
    sets out processes, structures and policies for managing AI risks across the lifecycle.
  notes: >-
    Short topical; "Govern" is contents entry 5.1. The first bullet is the required fact; the
    expected answer summarises the remaining bullets on the same page.
  source: "claude-separate-session, user-reviewed"

- id: sl-12
  document: fed_mpr_feb2025.pdf
  type: factual
  question: How fast has labor productivity grown since the pandemic began?
  answerable: true
  evidence:
    - page: 28
      quote: >-
        productivity has increased at an average annual rate of 1.8 percent from 2019:Q4 to
        2024:Q4
  expected_answer: >-
    About 1.8 percent a year on average from 2019:Q4 to 2024:Q4, above the 1.5 percent pace of
    2007:Q4 to 2019:Q4.
  notes: >-
    Short topical; same topic as sl-07 (Box 2) but asks for the content. Trap: the 1.5 percent
    figure is the previous business cycle's pace.
  source: "claude-separate-session, user-reviewed"
