[project]
name = "adaptive-rag"
version = "0.1.0"
description = "Local-first RAG with evaluation-driven chunking and adaptive retrieval"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9,<2",
    "fastapi>=0.115",
    "ollama>=0.6",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "tiktoken>=0.8",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "fpdf2>=2.8",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_rag = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server with the configured models"]
addopts = "-m 'not ollama'"

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
